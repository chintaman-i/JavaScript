<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      function convertLength(length, from, to) {
        if (from === 'km' && to === 'miles') {
          return `${length / 1.6} ${to}`;

        } else if (from === 'km' && to === 'ft') {
          return `${length * 3281} ${to}`;
          
        } else if (from === 'miles' && to === 'km') {
          return `${length * 1.6} ${to}`;

        } else if (from === 'miles' && to === 'ft') {
          return `${length * 5280} ${to}`;

        } else if (from === 'ft' && to === 'km') {
          return `${length / 3281} ${to}`;

        } else if (from === 'ft' && to === 'miles') {
          return `${length / 5280} ${to}`;

     
        } else if (from === to) {
          return `${length} ${to}`;
        }
      }

      console.log(convertLength(500, 'miles', 'km'));
      console.log(convertLength(23, 'km', 'miles'));
      console.log(convertLength(90, 'km', 'km'));

      console.log(convertLength(10, 'miles', 'km'));
      console.log(convertLength(10, 'miles', 'ft'));
      console.log(convertLength(10, 'km', 'ft'));
    </script>
  </body>
</html>
